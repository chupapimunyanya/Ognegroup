services:
  db:
    image: postgres:16-alpine
    container_name: ognegroup_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: OgnegroupDb
    ports:
      - "5432:5432"
    volumes:
      - ognegroup_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ognegroup_postgres_data: